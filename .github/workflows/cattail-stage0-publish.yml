name: CATTAIL one-time segmented-tail publish
on:
  push:
    paths:
      - .github/workflows/cattail-stage0-publish.yml
permissions:
  contents: write
jobs:
  stage0:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Restore validated binary and manifest blobs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, urllib.request
          objects = {
            "sites/cattail/assets/cats/tabby-legacy/atlas.webp": "db446ad99194f84fdac9618ddc3535648b6be098",
            "sites/cattail/assets/cats/tabby-legacy/variant.json": "eb8dad2d3ccde2d9ec0c45bfde1dad33eaf0b301",
            "sites/cattail/assets/cattail-cat-variants.js": "3df6b7af35e1568cabe1e7a1658f8b67a51aa5dc",
            "tools/cattail/legacy_masks.npz": "3d9b279c693ff9a9885d5bedff704930fb3b081a",
          }
          for path, sha in objects.items():
              url = "https://api.github.com/repos/" + os.environ["GITHUB_REPOSITORY"] + "/git/blobs/" + sha
              req = urllib.request.Request(url, headers={
                  "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              })
              with urllib.request.urlopen(req, timeout=40) as resp:
                  blob = json.load(resp)
              data = base64.b64decode(blob["content"])
              actual = hashlib.sha1(b"blob " + str(len(data)).encode() + b"\0" + data).hexdigest()
              if actual != sha:
                  raise RuntimeError(path + ": blob hash mismatch")
              p = pathlib.Path(path)
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_bytes(data)
              print("Restored", path, len(data), "bytes", sha)
          v = json.loads(pathlib.Path("sites/cattail/assets/cats/tabby-legacy/variant.json").read_text())
          assert v["chains"]["tail"] == ["tail1", "tail2", "tail3", "tail4"]
          print("Tail manifest and registry restored")
          PY
      - name: Commit stage 0 and remove temporary deployment workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sites/cattail/assets/cats/tabby-legacy/atlas.webp sites/cattail/assets/cats/tabby-legacy/variant.json sites/cattail/assets/cattail-cat-variants.js tools/cattail/legacy_masks.npz
          git rm .github/workflows/cattail-stage0-publish.yml
          git diff --cached --check
          git commit -m 'CATTAIL: publish segmented orange-cat tail and remove recolors'
          git push origin HEAD:main
